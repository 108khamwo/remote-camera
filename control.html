<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css?v=02"><title>Control Center</title></head><body><main class="wrap"><div class="topbar"><div class="brand">🖥️ Control Center</div><a class="badge" href="index.html">หน้าหลัก</a></div><div class="grid"><section><div class="card"><div class="preview"><video id="remoteVideo" autoplay playsinline></video><div class="overlay"><div id="status" class="status">DISCONNECTED</div><div id="latency" class="status">—</div></div></div><div class="toolbar"><button id="front" class="ghost">กล้องหน้า</button><button id="rear" class="ghost">กล้องหลัง</button><button id="zoomOut" class="ghost">− Zoom</button><button id="zoomIn" class="ghost">+ Zoom</button></div><div class="spacer"></div><div class="row"><div><label>Remote Zoom</label><input id="zoom" type="range" min="1" max="8" step="0.1" value="1"></div><div><label>ค่าที่ส่ง</label><input id="zoomValue" value="1.0" readonly></div></div></div><div class="spacer"></div><div class="card"><div class="section-title">เชื่อมต่อกล้อง</div><div class="row"><div><label>Room</label><input id="room" value="remote-cam-test"></div><div><label>Stream ID</label><input id="streamId" value="cam01"></div></div><div class="spacer"></div><div class="row"><button id="connect" class="primary">เชื่อมต่อ</button><button id="disconnect" class="danger">ตัดการเชื่อมต่อ</button></div></div></section><aside><div class="card"><div class="section-title">OBS Browser Source URL</div><div class="copybox"><input id="obsUrl" readonly><button id="copy">คัดลอก</button></div><div class="spacer"></div><div class="mini">นำ URL นี้ไปใส่ OBS → Sources → Browser Source แล้วตั้งขนาดตามงาน เช่น 1920×1080</div></div><div class="spacer"></div><div class="card"><div class="section-title">Log</div><div id="log" class="log"></div></div></aside></div></main><script src="https://cdn.jsdelivr.net/gh/steveseguin/ninjasdk@latest/vdoninja-sdk.min.js"></script><script src="control.js?v=02"></script></body></html>
