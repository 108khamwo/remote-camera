<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}video{width:100vw;height:100vh;object-fit:contain;background:#000}</style><title>OBS Receiver</title></head><body><video id="v" autoplay playsinline></video><script src="sdk-loader.js?v=03"></script><script>
(async()=>{await loadVDONinjaSDK();const p=new URLSearchParams(location.search),room=p.get('room')||'remote-cam-test',streamID=p.get('stream')||'cam01';const video=document.getElementById('v'),ms=new MediaStream();video.srcObject=ms;const vdo=new VDONinjaSDK({autoRecover:true,autoRelay:true,salt:'vdo.ninja'});vdo.addEventListener('track',e=>{const t=e.detail?.track;if(t&&!ms.getTracks().includes(t))ms.addTrack(t)});await vdo.connect();await vdo.joinRoom({room});await vdo.view(streamID,{audio:true,video:true,label:'obs'});})().catch(console.error);
</script></body></html>
